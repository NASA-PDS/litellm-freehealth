# 🏃‍♀️ Continuous Integration and Delivery: Unstable
# =================================================
#
# Note: for this workflow to succeed, the following secrets must be installed
# in the repository (or inherited from the repository's organization):
#
# ``ADMIN_GITHUB_TOKEN``
#     A personal access token of a user with collaborator or better access to
#     the project repository. You can generate this by visiting GitHub →
#     Settings → Developer settings → Personal access tokens → Generate new
#     token. Give the token scopes on ``repo``, ``write:packages``,
#     ``delete:packages``, ``workflow``, and ``read:gpg_key``.
# ``TEST_PYPI_USERNAME``
#     Username for test.pypi.org.
# ``TEST_PYPI_PASSWORD``
#     Password for ``TEST_PYPI_USERNAME``.
#


---

name: 🤪 Unstable integration & delivery


# Driving Event
# -------------
#
# What event starts this workflow: a push to any branch. Images are tagged as
# ``<branch>-<sha>`` in all cases. The ``:latest`` tag is never updated so that
# deployments always reference an explicit, reproducible image.

on:
    push:
        branches:
             - '**'
        paths-ignore:
            - 'CHANGELOG.md'
            - 'docs/requirements/**'
    workflow_dispatch:

# Per-branch concurrency so parallel branch builds don't queue behind each other.
concurrency: ${{ github.ref }}


# What to Do
# ----------
#
# Round up, yee-haw!

jobs:
    unstable-assembly:
        name: 🧩 Unstable Assembly
        if: github.actor != 'pdsen-ci'
        runs-on: ubuntu-latest
        steps:
            -
                name: 💳 Checkout
                uses: actions/checkout@v5
                with:
                    lfs: true
                    token: ${{secrets.ADMIN_GITHUB_TOKEN}}
                    fetch-depth: 0
            -
                name: 💳 Docker Hub Identification
                uses: docker/login-action@v3
                with:
                    username: ${{secrets.DOCKERHUB_USERNAME}}
                    password: ${{secrets.DOCKERHUB_TOKEN}}
            -
                name: 🎰 QEMU Multiple Machine Emulation
                uses: docker/setup-qemu-action@v3
            -
                name: 🚢 Docker Buildx
                uses: docker/setup-buildx-action@v3
            -
                name: 🏷️ Compute Image Tags
                id: image-tags
                run: |
                    BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
                    TAGS="${{secrets.DOCKERHUB_USERNAME}}/litellm-freehealth:${BRANCH}-${{ github.sha }}"
                    if [ "${{ github.ref_name }}" = "main" ]; then
                        TAGS="${TAGS},${{secrets.DOCKERHUB_USERNAME}}/litellm-freehealth:latest"
                    fi
                    echo "tags=${TAGS}" >> $GITHUB_OUTPUT
            -
                name: 🧱 Image Construction and Publication
                uses: docker/build-push-action@v6
                with:
                    context: ./docker
                    build-args: IMAGE_TAG=${{ github.sha }}
                    file: ./docker/Dockerfile
                    platforms: linux/amd64,linux/arm64
                    push: true
                    tags: ${{ steps.image-tags.outputs.tags }}

...

